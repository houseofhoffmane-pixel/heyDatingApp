# Local dev infra for Hey backend.
# `docker compose up -d` and the API can talk to Postgres+PostGIS and Redis.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hey
      POSTGRES_PASSWORD: hey
      POSTGRES_DB: hey
    ports:
      - "5432:5432"
    volumes:
      - hey-pgdata:/var/lib/postgresql/data
      - ./prisma/init-shadow.sql:/docker-entrypoint-initdb.d/01-shadow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hey -d hey"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hey-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hey-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hey-pgdata:
  hey-redisdata:
