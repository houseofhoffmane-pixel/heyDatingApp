# Local dev infra for Hey backend (Sprint 9 — Postgres + PostGIS).
# `docker compose up -d` gives you a local Postgres for dev; production
# runs on Neon (Postgres over WebSocket) so the app can reach the DB
# from any host including Hostinger.
# (Redis was removed in Sprint 2 — presence, rate limits, and the
# feed-shown cache all live in-process now.)

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hey
      POSTGRES_PASSWORD: hey
      POSTGRES_DB: hey
    ports:
      - "5432:5432"
    volumes:
      - hey-pgdata:/var/lib/postgresql/data
      - ./prisma/init-shadow.sql:/docker-entrypoint-initdb.d/01-shadow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hey -d hey"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hey-pgdata:
