# Local dev infra for Hey backend (Sprint 3 — MySQL 8).
# `docker compose up -d` and the API can talk to MySQL.
# Production runs on Hostinger's managed MySQL — this compose is dev-only.

services:
  mysql:
    image: mysql:8.0
    container_name: hey-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hey
      MYSQL_USER: hey
      MYSQL_PASSWORD: hey
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - hey-mysqldata:/var/lib/mysql
      - ./prisma/init-shadow.sql:/docker-entrypoint-initdb.d/01-shadow.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-hlocalhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hey-mysqldata:
